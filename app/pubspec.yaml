name: hapstore
description: 轻启·安装器 —— 从 GitHub 发现 HAP 应用，一键签名安装
publish_to: none
version: 0.1.0+2026092801

environment:
  # 与鸿蒙 Flutter 工具链（3.7.12-ohos / Dart 2.19.6）保持一致，
  # 兼容的上界也允许官方 Flutter 3.x 构建，便于跑单元测试。
  sdk: '>=2.19.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 签名与侧载核心（本地包，纯 Dart，无 Flutter 依赖）。
  # 唯一副本在 core/logic（App 与 CLI 工具共用，避免双实现分叉）。
  signing_core:
    path: ../core/logic

  # 鸿蒙平台适配（signCmd / hdcCmd / tempDir 等）
  ohos_adapter:
    path: plugins/ohos_adapter

  cupertino_icons: ^1.0.6
  path: ^1.8.2
  pointycastle: ^3.7.3
  path_provider: ^2.0.15
  # http 1.x 要求 Dart 3；鸿蒙工具链是 2.19.6，故用 0.13.x
  http: ^0.13.6
  crypto: ^3.0.2

dev_dependencies:
  archive: ^3.4.10
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
