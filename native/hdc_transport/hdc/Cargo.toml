[package]
name = "qingqi-hdc-transport"
description = "Muka Rust HDC - a Rust reimplementation of Huawei's HDC (HarmonyOS Device Connector) host tool"
version = "0.1.0"
edition = "2021"
authors = ["Attect", "Qingqi contributors"]
license = "MIT"
repository = "https://github.com/Attect/muka_rust_hdc"

[lib]
name = "qingqi_hdc_transport"
path = "src/lib.rs"

[dependencies]
hdc-protocol = { path = "../hdc-protocol" }
tokio = { version = "1.40", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.7"
rand = "0.8"
rusb = "0.9"
libusb1-sys = "0.7"
libc = "0.2"
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
