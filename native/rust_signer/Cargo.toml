[package]
name = "qingqi_signer_bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
qingqi-hdc-transport = { path = "../hdc_transport/hdc" }
hapsigner = { git = "https://github.com/harmony-contrib/hapsigner-rs.git", rev = "519783fd0002603bf518ff8f96a757517fccc00d", default-features = false }
memmap2 = "0.9"
zeroize = "1"
p256 = { version = "0.13.2", features = ["pkcs8"] }
p384 = { version = "0.13.1", features = ["pkcs8"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 0
# The static archive still needs its FFI symbols for the final NAPI link.
# The release shared library's export map/strip removes implementation symbols.
strip = "debuginfo"
# Native entrypoints translate caught panics to errors; abort would kill the app.
panic = "unwind"
